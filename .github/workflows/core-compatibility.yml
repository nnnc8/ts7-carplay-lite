name: Lawful core API27 compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api27-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-27' 'build-tools;35.0.0'
      - name: Source, license, credentials and frozen renderer audit
        run: python3 receiver-core/tools/verify_source.py
      - name: Provider and eight protocol integration scenarios
        run: bash receiver-core/test.sh
      - name: Actual API27 core compilation and bounded source fixtures
        run: bash receiver-core/compatibility-test.sh
      - name: Preserve receiver and Diagnostic contract tests
        run: |
          ./receiver/test.sh
          ./diagnostic-app/test.sh
