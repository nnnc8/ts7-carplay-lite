name: Build TS7 Diagnostic

on:
  push:
    paths:
      - 'diagnostic/**'
      - '.github/workflows/build-diagnostic.yml'
  pull_request:
    paths:
      - 'diagnostic/**'
      - '.github/workflows/build-diagnostic.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zip openjdk-17-jdk-headless file

      - name: Build APK
        run: ./diagnostic/scripts/build.sh

      - name: Inspect artifact
        run: |
          unzip -l dist/TS7-Diagnostic-v0.1.apk
          jarsigner -verify dist/TS7-Diagnostic-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TS7-Diagnostic-v0.1
          path: dist/TS7-Diagnostic-v0.1.apk
          if-no-files-found: error
