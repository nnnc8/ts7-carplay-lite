name: Build TS7 DiPlay API27 development

on:
  push:
    branches: [main, feature/diplay-ts7-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TS7_CARPLAY_UPLOAD_URL: https://ts7-carplay-lite-relay.vercel.app/api/carplay-diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-27' 'build-tools;35.0.0' 'ndk;25.2.9519653'
      - name: DiPlay API27 and ARMv7 source build
        run: |
          ./diplay-port/build.sh
          TS7_AUTH_FIXTURE_OUTPUT_DIR=build/auth-fixture ./diplay-port/test.sh
          python3 diplay-port/tools/verify_source.py
      - name: Core and privacy contracts
        run: |
          ./receiver/test.sh
          ./diagnostic-app/test.sh
          npm --prefix backend test
      - name: Build and inspect platform APKs
        run: |
          TS7_SKIP_CORE_BUILD=1 ./receiver/build.sh
          TS7_SKIP_CORE_BUILD=1 ./receiver/build.sh --instrumented
          TS7_SKIP_CORE_BUILD=1 TS7_AUTH_FIXTURE=1 TS7_ENABLE_EXPERIMENTAL_AUTH=1 TS7_DIPLAY_AUTH_ASSETS_DIR="$PWD/build/auth-fixture" ./receiver/build.sh --instrumented
      - name: Upload requested platform APK
        uses: actions/upload-artifact@v4
        with:
          name: TS7-CarPlay-Lite-DiPlay-v1.0.0-dev.apk
          path: dist/TS7-CarPlay-Lite-DiPlay-v1.0.0-dev.apk
          if-no-files-found: error

      - name: Upload generated authentication test fixture (not for installation)
        uses: actions/upload-artifact@v4
        with:
          name: TS7-Authentication-Test-Fixture
          path: dist/TS7-CarPlay-Lite-DiPlay-v1.0.0-dev-auth-fixture-instrumented.apk
          if-no-files-found: error
      - name: Upload separate instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: TS7-Alpha-Instrumentation
          path: dist/TS7-CarPlay-Lite-DiPlay-v1.0.0-dev-instrumented.apk
          if-no-files-found: error

  android-81-surface:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: TS7-CarPlay-Lite-DiPlay-v1.0.0-dev.apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: TS7-Alpha-Instrumentation
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: TS7-Authentication-Test-Fixture
          path: dist
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Actual API27 platform probes, normal startup, auth gate and preserved Surface test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./receiver/ci-smoke.sh
      - name: Upload readiness and renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TS7-API27-Surface-evidence
          path: |
            dist/renderer-smoke.txt
            dist/renderer-smoke.png
            dist/renderer-logcat.txt
            dist/normal-startup.txt
            dist/normal-startup.xml
            dist/normal-startup.png
            dist/platform-readiness-smoke.txt
            dist/platform-readiness-smoke.png
            dist/authentication-smoke.txt
          if-no-files-found: warn
